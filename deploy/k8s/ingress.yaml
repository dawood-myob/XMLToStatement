apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: xml-to-statement
  annotations:
    # ingress-nginx: allow uploads larger than the 1 MB default
    nginx.ingress.kubernetes.io/proxy-body-size: 50m
spec:
  ingressClassName: nginx
  rules:
    - host: statements.example.com # replace with your host
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: xml-to-statement
                port:
                  name: http
